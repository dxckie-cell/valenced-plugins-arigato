name: Deploy plugin repository

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.POOL_BRANCH || 'gh-pages' }}
      - uses: actions/configure-pages@v5
      # Named per attempt, so a re-run never finds the artifact of an earlier attempt too
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      # GitHub lists a new artifact a few seconds late, and deploy-pages looks it up right away
      - run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
